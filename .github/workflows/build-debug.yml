name: Build Debug

on:
  workflow_dispatch:

jobs:
  Android:
    name: Android Debug
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a -PbundleInDebug=true --parallel --build-cache -x lint -x lintVitalAnalyzeDebug

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Upload Artifact arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: debug-v${{ env.PACKAGE_VERSION }}-arm64-v8a
          path: android/app/build/outputs/apk/debug/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
